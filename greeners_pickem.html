<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2c"><title>Greeners Pick'em</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf2fc;background:#0b1220}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#101b31,#0b1220 60%);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}.logo{font-size:24px;font-weight:900;letter-spacing:-.7px}.silver{color:#b8c6db}.tag{font-size:11px;color:#c8d3e4;border:1px solid #53617b;padding:7px 9px;border-radius:30px}h1{font-size:28px;margin:16px 0 4px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:14px 0 8px}.muted,.note{color:#b2bfd3}.note{font-size:13px;line-height:1.5}.panel{background:#17243a;border:1px solid #354760;border-radius:16px;padding:17px;margin:15px 0;box-shadow:0 8px 25px #0002}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0}.tabs button{white-space:nowrap;flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:14px;background:#21324e;border:1px solid #435777;border-radius:12px}.metric strong{font-size:24px;display:block}.metric small{color:#b6c7e0}button{background:#273e61;border:1px solid #56719b;color:#f5f8ff;padding:12px 13px;border-radius:10px;font-weight:750;cursor:pointer}button.selected,button.primary{background:#b7c5d9;color:#0d1b31;border-color:#dbe5f2}button.danger{background:#622e40;border-color:#ad5266}button.red{background:#a5324e;border-color:#d65d79}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #5b7092;background:#0d192c;color:#fff;border-radius:9px;padding:12px;font-size:16px}label{display:block;margin:12px 0 6px;color:#dce5f4;font-size:14px;font-weight:650}.teams{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}.game{padding:15px 0;border-top:1px solid #344660}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px}.full{width:100%}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 5px;border-bottom:1px solid #344660;text-align:left}th:last-child,td:last-child{text-align:right}.scroll{overflow:auto}.pill{border-radius:20px;padding:4px 8px;background:#2a405f;font-size:11px}.hide{display:none}.notice{border-left:3px solid #b9435b;padding-left:11px}.success{color:#b7e4d4}.error{color:#ffacba}footer{font-size:12px;color:#95a8c4;padding:20px 0 35px}@media(max-width:480px){.wrap{padding:12px}.logo{font-size:20px}.grid{gap:6px}.metric{padding:10px}.metric strong{font-size:20px}.tabs button{padding:10px}}
</style></head><body><main class="wrap"><header><div class="logo">🏈 GREENERS <span class="silver">PICK'EM</span></div><span class="tag">PRIVATE LEAGUE · LOCAL EDITION</span></header><h1>Own Sunday.</h1><p class="muted">Pick the winners. Chase the standings. Brag all week.</p><div class="grid" id="metrics"></div><nav class="tabs" id="tabs"><button data-tab="picks" class="selected">My Picks</button><button data-tab="standings">Standings</button><button data-tab="league">Players</button><button data-tab="admin">Commissioner</button></nav><div id="view"></div><footer>Offline/local edition. Data stays in this browser unless you export it. This is not a hosted multi-player service or a live NFL schedule.</footer></main><script>
'use strict';const KEY='greeners-pickem-v2';const sample=[{away:'Dallas Cowboys',home:'Philadelphia Eagles',kickoff:''},{away:'Buffalo Bills',home:'Kansas City Chiefs',kickoff:''},{away:'Green Bay Packers',home:'Chicago Bears',kickoff:''}];const initial=()=>({week:1,players:['You'],current:'You',games:sample.map((g,i)=>({...g,id:i+1,winner:''})),entries:{},lock:'',commissionerPin:'',nextId:4});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}if(!Array.isArray(data.players)||!Array.isArray(data.games)||!data.entries)data=initial();let tab='picks',adminUnlocked=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Storage unavailable. Export your league data to keep a copy.')}}function key(p,w=data.week){return w+'|'+p}function entry(p){return data.entries[key(p)]||{picks:{},points:''}}function locked(){return !!data.lock&&Date.now()>=new Date(data.lock).getTime()}function results(p){let e=entry(p),wins=0,losses=0;for(let g of data.games){if(g.winner&&e.picks[g.id]){if(g.winner===e.picks[g.id])wins++;else losses++}}return {wins,losses,score:wins}}function metrics(){let r=results(data.current);$('#metrics').innerHTML=`<div class="metric"><strong>${r.wins}</strong><small>Wins</small></div><div class="metric"><strong>${r.losses}</strong><small>Losses</small></div><div class="metric"><strong>W${esc(data.week)}</strong><small>Current week</small></div>`}function render(){metrics();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));$('#view').innerHTML=({picks:showPicks,standings:showStandings,league:showLeague,admin:showAdmin}[tab])();bind()}function showPicks(){let e=entry(data.current),islocked=locked();return `<section class="panel"><h2>Week ${data.week} picks <span class="pill">${islocked?'LOCKED':'OPEN'}</span></h2><label>Picking as</label><select id="who">${data.players.map(p=>`<option ${p===data.current?'selected':''}>${esc(p)}</option>`).join('')}</select><p class="note">${data.lock?'All picks lock at '+esc(new Date(data.lock).toLocaleString())+'.':'Commissioner has not set a lock time.'} ${!data.games.some(g=>g.kickoff)?'Matchups are samples until the commissioner replaces them.':''}</p>${data.games.map((g,i)=>`<div class="game"><div class="row"><strong>Game ${i+1}</strong><span class="small muted">${g.kickoff?esc(new Date(g.kickoff).toLocaleString()):'Kickoff not set'}</span></div><div class="teams">${[g.away,g.home].map(t=>`<button data-pick="${g.id}" data-team="${esc(t)}" class="${e.picks[g.id]===t?'selected':''}" ${islocked?'disabled':''}>${esc(t)}</button>`).join('')}</div>${g.winner?`<span class="small success">Result: ${esc(g.winner)}</span>`:''}</div>`).join('')}<label>Sunday Night Football total points tiebreaker</label><input id="points" type="number" min="0" max="200" value="${esc(e.points)}" ${islocked?'disabled':''} placeholder="e.g. 47"><button id="savePicks" class="primary full" style="margin-top:15px" ${islocked?'disabled':''}>Save picks</button><p class="note" id="status">Selections are saved to this device only.</p></section>`}function showStandings(){let ranked=data.players.map(p=>({p,...results(p),t:entry(p).points})).sort((a,b)=>b.wins-a.wins||a.losses-b.losses||a.p.localeCompare(b.p));return `<section class="panel"><h2>Week ${data.week} standings</h2><p class="note">Scores update when the commissioner records winners. Tiebreaker is recorded but not automatically scored because the actual Sunday night total isn't entered.</p><div class="scroll"><table><thead><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>SNF guess</th></tr></thead><tbody>${ranked.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.p)}</td><td>${r.wins}</td><td>${r.losses}</td><td>${locked()?esc(r.t??'—'):'Hidden until lock'}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>Pick visibility</h2><p class="note">${locked()?'The lock has passed. Saved picks are shown below.':'Other players’ picks stay hidden until the league lock.'}</p>${locked()?ranked.map(r=>`<h3>${esc(r.p)}</h3><p class="note">${data.games.map(g=>esc(entry(r.p).picks[g.id]||'No pick')).join(' · ')}</p>`).join(''):''}</section>`}function showLeague(){return `<section class="panel"><h2>League players</h2><p class="note">Each player is a local profile, not a password-protected account. This is for running a league on one device or tracking submitted picks manually.</p>${data.players.map(p=>`<div class="game row"><strong>${esc(p)}</strong><span class="pill">${Object.keys(entry(p).picks).length}/${data.games.length} picks</span></div>`).join('')}<label>Add player</label><input id="newPlayer" maxlength="32" placeholder="Player name"><button class="primary full" id="addPlayer" style="margin-top:10px">Add player</button></section>`}function showAdmin(){if(data.commissionerPin&&!adminUnlocked)return `<section class="panel"><h2>Commissioner access</h2><label>Commissioner PIN</label><input type="password" id="pin" inputmode="numeric"><button id="unlock" class="primary full" style="margin-top:10px">Unlock</button><p class="note">PIN protects this screen on this device only. It is not secure online authentication.</p></section>`;return `<section class="panel"><h2>Commissioner controls</h2><p class="note notice">Changes here affect only this device. Export a backup before major changes.</p><label>Week number</label><input id="week" type="number" min="1" max="30" value="${data.week}"><button id="setWeek" class="full" style="margin-top:9px">Switch week</button><label>League-wide lock time (your local time)</label><input id="lock" type="datetime-local" value="${esc(data.lock)}"><button id="setLock" class="full" style="margin-top:9px">Save lock time</button><h3>Games & results</h3>${data.games.map(g=>`<div class="game"><div class="small muted">Game ID ${g.id}</div><div class="row"><input aria-label="Away team" id="a${g.id}" value="${esc(g.away)}"><input aria-label="Home team" id="h${g.id}" value="${esc(g.home)}"></div><label>Kickoff (optional)</label><input type="datetime-local" id="k${g.id}" value="${esc(g.kickoff||'')}"><label>Winner</label><select id="w${g.id}"><option value="">Not final</option>${[g.away,g.home].map(t=>`<option ${g.winner===t?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('')}</select><div class="row" style="margin-top:9px"><button data-update="${g.id}">Save game</button><button class="danger" data-remove="${g.id}">Remove</button></div></div>`).join('')}<button id="addGame" class="full">+ Add game</button><h3>League backup</h3><div class="row"><button id="export">Export JSON</button><button id="importBtn">Import JSON</button></div><input type="file" id="importFile" accept="application/json,.json" class="hide"><label>Commissioner PIN (optional)</label><input id="newPin" type="password" placeholder="Set or change PIN" autocomplete="new-password"><button id="setPin" class="full" style="margin-top:9px">Save PIN</button><button id="reset" class="danger full" style="margin-top:18px">Reset entire local league</button></section>`}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(tab==='picks'){let draft={...entry(data.current),picks:{...entry(data.current).picks}};$('#who').onchange=e=>{data.current=e.target.value;save();render()};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{draft.picks[b.dataset.pick]=b.dataset.team;document.querySelectorAll(`[data-pick="${b.dataset.pick}"]`).forEach(x=>x.classList.toggle('selected',x===b))});$('#savePicks').onclick=()=>{if(locked())return render();let p=$('#points').value;if(data.games.some(g=>!draft.picks[g.id])||!Number.isInteger(Number(p))||p===''||+p<0||+p>200){$('#status').textContent='Choose every winner and enter a whole-number tiebreaker from 0–200.';$('#status').className='note error';return}data.entries[key(data.current)]={picks:draft.picks,points:Number(p)};save();$('#status').textContent='Saved successfully on this device.';$('#status').className='note success';metrics()}}if(tab==='league')$('#addPlayer').onclick=()=>{let p=$('#newPlayer').value.trim();if(!p||data.players.some(x=>x.toLowerCase()===p.toLowerCase()))return alert('Enter a unique player name.');data.players.push(p);save();render()};if(tab!=='admin')return;if(data.commissionerPin&&!adminUnlocked){$('#unlock').onclick=()=>{if($('#pin').value===data.commissionerPin){adminUnlocked=true;render()}else alert('Incorrect PIN')};return}$('#setWeek').onclick=()=>{let w=Number($('#week').value);if(!Number.isInteger(w)||w<1||w>30)return alert('Enter a week from 1 to 30.');data.week=w;save();render()};$('#setLock').onclick=()=>{data.lock=$('#lock').value;save();render()};document.querySelectorAll('[data-update]').forEach(b=>b.onclick=()=>{let g=data.games.find(x=>x.id===Number(b.dataset.update)),a=$('#a'+g.id).value.trim(),h=$('#h'+g.id).value.trim();if(!a||!h||a===h)return alert('Enter two different team names.');g.away=a;g.home=h;g.kickoff=$('#k'+g.id).value;g.winner=$('#w'+g.id).value;if(g.winner!==a&&g.winner!==h)g.winner='';save();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Remove this game?')){data.games=data.games.filter(g=>g.id!==Number(b.dataset.remove));save();render()}});$('#addGame').onclick=()=>{data.games.push({id:data.nextId++,away:'Away team',home:'Home team',kickoff:'',winner:''});save();render()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='greeners-week-'+data.week+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.players)||!Array.isArray(d.games)||!d.entries||!Number.isInteger(d.week))throw Error('Invalid backup');if(confirm('Replace all local league data with this backup?')){data=d;adminUnlocked=false;save();render()}}catch(err){alert('Could not import: '+err.message)}};$('#setPin').onclick=()=>{data.commissionerPin=$('#newPin').value;adminUnlocked=true;save();alert('PIN saved locally.')};$('#reset').onclick=()=>{if(confirm('Erase all local players, picks, games, and results?')){data=initial();adminUnlocked=false;save();render()}}}render();
</script></body></html>
